<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Búnker — Roadmap Tracker v5</title>
<style>
  :root {
    --bg: #050505;
    --acid: #bfff00;
    --purple: #d966ff;
    --red: #ff3b3b;
    --orange: #ff6b35;
    --cyan: #00ffcc;
    --glass: rgba(191,255,0,0.03);
    --border: rgba(191,255,0,0.12);
    --font: 'JetBrains Mono', 'Courier New', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--acid);
    font-family: var(--font);
    line-height: 1.6;
    padding: 2rem;
    max-width: 960px;
    margin: 0 auto;
    min-height: 100vh;
  }
  h1 {
    font-size: 1.4rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 0.25rem;
    text-shadow: 0 0 20px var(--acid);
  }
  .subtitle {
    text-align: center;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    opacity: 0.4;
    margin-bottom: 1.5rem;
  }
  .progress-container {
    margin-bottom: 1.5rem;
    padding: 1rem;
    border: 1px solid var(--border);
    background: var(--glass);
    border-radius: 2px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    margin-bottom: 0.5rem;
  }
  .progress-bar {
    height: 4px;
    background: rgba(191,255,0,0.1);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--acid), var(--cyan));
    box-shadow: 0 0 10px var(--acid);
    transition: width 0.5s ease;
    border-radius: 2px;
  }
  .phase {
    margin-bottom: 1.5rem;
    border: 1px solid var(--border);
    background: var(--glass);
    border-radius: 2px;
  }
  .phase-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.7rem 1rem;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid var(--border);
  }
  .phase-header:hover { background: rgba(191,255,0,0.02); }
  .phase-title {
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .phase-stats {
    font-size: 0.6rem;
    opacity: 0.6;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .phase-arrow {
    transition: transform 0.3s ease;
    font-size: 0.55rem;
  }
  .phase.collapsed .phase-arrow { transform: rotate(-90deg); }
  .phase.collapsed .phase-sessions { display: none; }
  .phase-sessions { padding: 0.4rem 0.8rem 0.8rem; }
  .session {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid rgba(191,255,0,0.04);
    transition: background 0.2s;
    cursor: pointer;
    font-size: 0.68rem;
  }
  .session:hover { background: rgba(191,255,0,0.015); }
  .session:last-child { border-bottom: none; }
  .session-check {
    width: 16px; height: 16px;
    border: 1.5px solid var(--border);
    border-radius: 2px;
    flex-shrink: 0;
    margin-top: 0.12rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.55rem;
    transition: all 0.3s ease;
  }
  .session-check.done {
    background: var(--acid); border-color: var(--acid);
    color: var(--bg); box-shadow: 0 0 8px var(--acid);
  }
  .session-check.active {
    border-color: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    animation: pulse-border 1.5s infinite;
  }
  @keyframes pulse-border {
    0%,100% { box-shadow: 0 0 4px var(--cyan); }
    50% { box-shadow: 0 0 14px var(--cyan); }
  }
  .session-content { flex: 1; min-width: 0; }
  .session-id {
    font-size: 0.55rem; letter-spacing: 0.12em;
    opacity: 0.4; margin-bottom: 0.1rem;
  }
  .session-name {
    font-size: 0.7rem; font-weight: bold; letter-spacing: 0.04em;
  }
  .session-files {
    font-size: 0.55rem; opacity: 0.3; margin-top: 0.15rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .controls {
    display: flex; gap: 0.5rem; justify-content: center;
    margin-bottom: 1rem; flex-wrap: wrap;
  }
  .btn {
    font-family: var(--font); font-size: 0.6rem;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--border);
    background: var(--glass); color: var(--acid);
    cursor: pointer; border-radius: 2px; transition: all 0.2s;
  }
  .btn:hover { background: rgba(191,255,0,0.06); border-color: var(--acid); }
  .btn.danger { border-color: rgba(255,59,59,0.4); color: var(--red); }
  .btn.danger:hover { background: rgba(255,59,59,0.06); }
  .hito {
    padding: 0.4rem 1rem; font-size: 0.55rem;
    letter-spacing: 0.12em; opacity: 0.45; text-align: center;
    border-top: 1px solid var(--border); margin-top: 0.2rem;
  }
  .hito.done { color: var(--acid); opacity: 0.65; }
  .hito.active { color: var(--cyan); opacity: 0.7; }
  .footer {
    text-align: center; font-size: 0.55rem;
    opacity: 0.22; margin-top: 2rem; letter-spacing: 0.18em;
  }
  .toast {
    position: fixed; bottom: 2rem; left: 50%;
    transform: translateX(-50%);
    background: var(--acid); color: var(--bg);
    padding: 0.4rem 1rem; font-size: 0.6rem;
    letter-spacing: 0.1em; border-radius: 2px;
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none; z-index: 100; font-family: var(--font);
  }
  .toast.show { opacity: 1; }
  .stats-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 0.5rem; margin-bottom: 1rem;
  }
  .stat-card {
    padding: 0.6rem; text-align: center;
    border: 1px solid var(--border);
    background: var(--glass); border-radius: 2px;
  }
  .stat-val { font-size: 1.1rem; font-weight: bold; line-height: 1.1; }
  .stat-lbl { font-size: 0.55rem; opacity: 0.4; letter-spacing: 0.12em; margin-top: 0.2rem; text-transform: uppercase; }
  @media (max-width: 600px) {
    body { padding: 0.8rem; }
    h1 { font-size: 1rem; }
  }
</style>
</head>
<body>

<h1>◈ EL BÚNKER ◈</h1>
<p class="subtitle">ROADMAP TRACKER v5 · S89 · JUNIO 2026</p>

<div class="controls">
  <button class="btn" onclick="expandAll()">▸ EXPANDIR TODO</button>
  <button class="btn" onclick="collapseAll()">▾ COLAPSAR TODO</button>
  <button class="btn danger" onclick="resetAll()">↺ RESET</button>
</div>

<div class="stats-row">

  </div>
  <div class="stat-card">
    <div class="stat-val" style="color:var(--cyan)">26</div>
    <div class="stat-lbl">Pendientes</div>
  </div>
  <div class="stat-card">

    <div class="stat-lbl">Specs completas</div>
  </div>
  <div class="stat-card">

<div class="progress-container">
  <div class="progress-label">
    <span>PROGRESO SESIONES</span>

  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
  </div>
</div>

<div id="phases"></div>

<div class="toast" id="toast"></div>
<p class="footer">THE_VAULT · ENCRYPTED · v5 · S89</p>

      { id:"S82", name:"Compat Sprint — safety gates D1", files:"tools/migrate_drive_to_d1.py", specs:"—" },
      { id:"S80", name:"Bugfixes TDZ + ref-during-render (5 fixes)", files:"PlayerContext,Layout,WinampPlayer", specs:"—" },

      { id:"S78", name:"Sesión+UX S1/S2/S8/UX1/UX2/UX5", files:"PlayerContext,WinampPlayer", specs:"S,UX" },
      { id:"S79", name:"MediaSession M1-M12 completo", files:"PlayerContext,WinampPlayer", specs:"M" }

      { id:"S85", name:"WCAG Romantiqueo + Dead YT Code", files:"11 archivos", specs:"WCAG" },

      { id:"S114", name:"Animaciones+rendimiento Android", files:"Layout,App.jsx", specs:"—" },
      { id:"S115", name:"Testing final+WCAG+ESLint+CHANGELOG v3.0", files:"—", specs:"—" }
    ], hito:"🔴 App ~98% specs. 14/14 taxonomía."

];

const preDone = new Set([
  "S50","S51","S52","S53","S54","S55","S56","S57","S58","S59",
  "S60","S61","S62","S63","S64","S65","S65a","S65b",
  "S66","S67","S68","S69","S70","S71","S72","S73","S74","S75",
  "S76","S77","S78","S79","S80","S81","S82",
  "S84","S85","S85c","S86","S87","S88","S89"
]);

const STORAGE_KEY = 'el_bunker_roadmap_v5';
let doneSessions = new Set(preDone);
try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  if (saved.length > 0) doneSessions = new Set([...preDone, ...saved]);
} catch(e) {}

function save() {
  const extra = [...doneSessions].filter(s => !preDone.has(s));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(extra));
  render();
}

function toggleSession(sid) {
  if (preDone.has(sid)) { toast('⚠ ' + sid + ' es pre-completada (Fase 0-6)'); return; }
  if (doneSessions.has(sid)) { doneSessions.delete(sid); }
  else { doneSessions.add(sid); }
  save();
  toast(doneSessions.has(sid) ? '✓ ' + sid + ' completada' : sid + ' pendiente');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function expandAll() { document.querySelectorAll('.phase').forEach(p => p.classList.remove('collapsed')); }
function collapseAll() { document.querySelectorAll('.phase').forEach(p => p.classList.add('collapsed')); }
function togglePhase(id) { document.querySelector(`[data-phase="${id}"]`)?.classList.toggle('collapsed'); }

function resetAll() {
  if (confirm('¿Resetear progreso de Fase 7-11? Las Fases 0-6 son inmutables.')) {
    doneSessions = new Set(preDone);
    save();
    toast('↺ Progreso Fase 7-11 reseteado');
  }
}

function render() {
  const container = document.getElementById('phases');
  let totalDone = 0, totalSessions = 0;
  let html = '';

  for (const phase of roadmap) {
    let phaseDone = 0;
    totalSessions += phase.sessions.length;

    let items = '';
    for (const s of phase.sessions) {
      const isDone = doneSessions.has(s.id);
      const isLocked = preDone.has(s.id);
      if (isDone) phaseDone++;
      items += `
        <div class="session" onclick="toggleSession('${s.id}')" title="${isLocked?'Fase 0-6 — inmutable':''}">
          <div class="session-check ${isDone?'done':(!isLocked&&phase.id===7?'active':'')}">${isDone?'✓':''}</div>
          <div class="session-content">
            <div class="session-id">${s.id}</div>
            <div class="session-name">${s.name}</div>
            <div class="session-files">📁 ${s.files} · 📐 ${s.specs}</div>
          </div>
        </div>`;
    }
    totalDone += phaseDone;
    const allDone = phaseDone === phase.sessions.length;
    const isActivePhase = phase.id === 7;

    html += `
      <div class="phase collapsed" data-phase="${phase.id}">
        <div class="phase-header" onclick="togglePhase(${phase.id})">
          <span class="phase-title">${phase.icon} ${phase.name}</span>
          <span class="phase-stats">${phaseDone}/${phase.sessions.length} <span class="phase-arrow">▼</span></span>
        </div>
        <div class="phase-sessions">${items}</div>
        <div class="hito ${allDone?'done':isActivePhase?'active':''}">${phase.hito}</div>
      </div>`;
  }

  container.innerHTML = html;
  document.getElementById('progressText').textContent = `${totalDone} / ${totalSessions} sesiones`;
  document.getElementById('progressFill').style.width = (totalDone / totalSessions * 100) + '%';
}

render();
</script>

</body>
</html>
