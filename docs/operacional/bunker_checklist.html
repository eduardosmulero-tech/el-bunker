<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#050505;--bg2:#0a0a0a;--bg3:#111;--bg4:#1a1a1a;--acid:#bfff00;--purple:#d966ff;--red:#ff3b3b;--orange:#ff6b35;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);--text:#e8e8e2;--muted:rgba(255,255,255,0.35);--mono:'JetBrains Mono','Courier New',monospace;--sans:'DM Sans',system-ui,sans-serif;--radius:6px;--tester-accent:var(--acid);--tester-badge-bg:rgba(191,255,0,0.12)}

  ::selection{background:rgba(191,255,0,0.25)}::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

  .hc{display:flex;align-items:center;gap:10px;margin:0 auto}@media(max-width:600px){.hc{order:3;width:100%;justify-content:center;padding-top:4px}}
  .tt{display:flex;background:var(--bg3);border-radius:20px;border:1px solid var(--border);padding:2px}
  .tb{padding:5px 14px;border-radius:18px;font-size:10px;font-weight:600;font-family:var(--mono);letter-spacing:0.04em;transition:all 0.2s;color:var(--muted);min-height:32px}
  .tb[data-a=true]{background:var(--tester-badge-bg);color:var(--tester-accent)}.td{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}

  .statb{font-family:var(--mono);font-size:9px;padding:4px 10px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:3px;min-height:28px}
  .statb.p{color:var(--acid);border-color:rgba(191,255,0,0.2);background:rgba(191,255,0,0.05)}
  @media(max-width:480px){.statb.hm{display:none}}
  .ib{width:36px;height:36px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);transition:all 0.15s;font-size:14px;background:var(--bg3);min-width:36px;min-height:36px}
  .ib:hover{border-color:var(--border2);background:var(--bg4)}.ib:active{transform:scale(0.94)}
  .pr{position:sticky;top:57px;z-index:99;height:2px;background:var(--bg3)}@media(max-width:600px){.pr{top:91px}}
  .pf{height:100%;background:var(--acid);transition:width 0.4s cubic-bezier(0.22,1,0.36,1);width:0%}
  .ly{display:grid;grid-template-columns:200px 1fr;min-height:calc(100dvh - 59px)}@media(max-width:860px){.ly{grid-template-columns:1fr}}
  .sideb{border-right:1px solid var(--border);overflow-y:auto;padding:8px 0 60px;background:var(--bg2)}@media(max-width:860px){.sideb{display:none}}
  .st{font-family:var(--mono);font-size:8px;letter-spacing:0.18em;color:var(--muted);padding:10px 16px 8px;text-transform:uppercase}
  .sl{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;cursor:pointer;font-size:11.5px;color:var(--muted);border-left:2px solid transparent;transition:all 0.12s;gap:4px;min-height:36px}
  .sl:hover{color:var(--text);background:var(--bg3)}.sl.a{color:var(--acid);border-left-color:var(--acid);background:rgba(191,255,0,0.03)}
  .sl .sn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sl .sp{font-family:var(--mono);font-size:9px;color:var(--muted);white-space:nowrap}
  .mn{display:none;gap:3px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch;scrollbar-width:none}
  @media(max-width:860px){.mn{display:flex}}
  .mb{flex-shrink:0;font-family:var(--mono);font-size:9px;padding:6px 12px;border-radius:14px;border:1px solid var(--border);background:var(--bg3);color:var(--muted);white-space:nowrap;transition:all 0.15s;min-height:32px}
  .mb.a{background:rgba(191,255,0,0.08);border-color:var(--acid);color:var(--acid)}
  .main{overflow-y:auto;padding:0 0 120px}
  .tb{padding:10px 16px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:rgba(5,5,5,0.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
  @media(max-width:600px){.tb{padding:8px 10px}}
  .fg{display:flex;gap:3px;flex-wrap:wrap}
  .fb{font-family:var(--mono);font-size:9px;padding:6px 10px;border-radius:14px;border:1px solid var(--border);background:var(--bg3);color:var(--muted);transition:all 0.15s;white-space:nowrap;min-height:30px}
  .fb.a{background:rgba(191,255,0,0.08);border-color:var(--acid);color:var(--acid)}.fb:active{transform:scale(0.95)}
  .sw{position:relative;flex:1;min-width:100px;max-width:220px;margin-left:auto}
  .sw input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:14px;color:var(--text);font-size:11px;padding:6px 12px 6px 28px;transition:border-color 0.15s;min-height:30px}
  .sw input:focus{outline:none;border-color:var(--border2)}.sw .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:10px;opacity:0.3;pointer-events:none}
  @media(max-width:600px){.sw{max-width:none;order:3;width:100%}}
  .sec{border-bottom:1px solid var(--border)}
  .sh{padding:14px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:43px;z-index:9;background:rgba(5,5,5,0.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  @media(max-width:600px){.sh{padding:10px 12px 8px;top:76px}}
  .sn{font-family:var(--mono);font-size:9px;letter-spacing:0.18em;color:var(--acid);text-transform:uppercase;font-weight:500;display:flex;align-items:center;gap:6px}.sn .si{font-size:11px;opacity:0.5}
  .sp{font-family:var(--mono);font-size:10px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .prr{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:600;color:var(--acid);background:conic-gradient(var(--acid) var(--p),var(--bg4) 0);position:relative}
  .prr::before{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--bg)}.prr span{position:relative;z-index:1}
  .it{border-bottom:1px solid var(--border);transition:all 0.15s;min-height:44px}.it:hover{background:var(--bg2)}.it.c{opacity:0.4}.it.c .il{text-decoration:line-through;color:var(--muted)}
  .im{display:flex;align-items:flex-start;gap:12px;padding:11px 20px;cursor:pointer;-webkit-user-select:none;user-select:none;min-height:44px}@media(max-width:600px){.im{padding:11px 12px;gap:10px}}
  .ic{flex-shrink:0;width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border2);margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
  .ic svg{opacity:0;transform:scale(0);transition:all 0.2s}.it.c .ic{background:var(--acid);border-color:var(--acid);box-shadow:0 0 8px rgba(191,255,0,0.25)}.it.c .ic svg{opacity:1;transform:scale(1)}
  .il{font-size:13px;line-height:1.5;color:var(--text);flex:1;min-width:0}.il strong{color:var(--acid);font-weight:500}.il code{font-family:var(--mono);font-size:11px;background:var(--bg3);padding:1px 5px;border-radius:3px;color:var(--purple)}
  .inb{flex-shrink:0;font-size:10px;font-family:var(--mono);padding:4px 10px;border-radius:10px;border:1px solid var(--border);color:var(--muted);background:var(--bg3);transition:all 0.15s;opacity:0;white-space:nowrap;min-height:28px}
  @media(max-width:600px){.inb{opacity:1;font-size:9px;padding:3px 8px}}.it:hover .inb{opacity:1}
  .it.hn .inb{opacity:1;color:var(--orange);border-color:rgba(255,107,53,0.3);background:rgba(255,107,53,0.06)}
  .ina{padding:0 20px 12px 50px;display:none;animation:sd 0.2s ease}.ina.o{display:block}@media(max-width:600px){.ina{padding:0 12px 12px 40px}}
  .ni{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:4px;color:var(--text);font-family:var(--mono);font-size:11px;padding:8px 10px;resize:vertical;min-height:56px;line-height:1.6}
  .ni:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 2px rgba(255,107,53,0.1)}
  @keyframes sd{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
  .sds{text-align:center;padding:12px 20px;font-family:var(--mono);font-size:9px;letter-spacing:0.15em;color:var(--acid);opacity:0.3}
  .ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}.ov.o{display:flex}@keyframes fi{from{opacity:0}to{opacity:1}}
  .md{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:24px;width:520px;max-width:92vw;max-height:85vh;overflow-y:auto}
  .md .mt{font-family:var(--mono);font-size:11px;letter-spacing:0.12em;color:var(--acid);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .md .mh{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.6}.md .mh code{font-family:var(--mono);font-size:11px;color:var(--acid)}
  .md textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:4px;color:var(--text);font-family:var(--mono);font-size:11px;padding:10px;resize:vertical;line-height:1.6}
  .md textarea:focus{outline:none;border-color:var(--acid)}.ma{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .bn{font-family:var(--mono);font-size:10px;letter-spacing:0.04em;padding:8px 16px;border-radius:4px;border:1px solid var(--border2);background:var(--bg3);color:var(--muted);transition:all 0.15s;font-weight:500;min-height:34px}
  .bn-p{border-color:var(--acid);color:var(--acid)}.bn-p:hover{background:rgba(191,255,0,0.08)}
  .bn-d{border-color:var(--red);color:var(--red)}
  .cc{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
  .cp{position:absolute;width:5px;height:5px;border-radius:1px}@keyframes cf{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(100dvh) rotate(720deg);opacity:0}}
  .es{text-align:center;padding:60px 20px;color:var(--muted);font-family:var(--mono);font-size:11px}.es .b{font-size:40px;margin-bottom:12px;opacity:0.2}
</style>
</head>
<body>
<div class="header">
  <div class="logo">◈ el_búnker <span>/ testing</span></div>
  <div class="hc">
    <div class="tt" id="tt">
      <button class="tb" onclick="setT('edu')"><span class="td" style="background:#bfff00"></span>EDU</button>
      <button class="tb" onclick="setT('david')"><span class="td" style="background:#d966ff"></span>DAVID</button>
    </div>
  </div>
  <div class="hr">
    <div class="statb hm">✓ <span id="sd">0</span>/<span id="st">0</span></div>

</div>
<div class="pr"><div class="pf" id="pf"></div></div>
<div class="mn" id="mn"></div>
<div class="ly">
  <nav class="sideb" id="sb"></nav>
  <div class="main" id="mc">
    <div class="tb">
      <div class="fg">
        <button class="fb a" onclick="setF('all',this)">todos</button>
        <button class="fb" onclick="setF('pending',this)">pendientes</button>
        <button class="fb" onclick="setF('done',this)">hechos</button>
        <button class="fb" onclick="setF('notes',this)">con nota</button>
      </div>
      <div class="sw">
        <span class="si">⌕</span>

    <div id="cr"></div>

</div>
<div class="ov" id="io">
  <div class="md">

</div>

</div>
<script>
const C=`### 🔐 AUTENTICACION
- [ ] Login thebunker.admin@gmail.com → entra
- [ ] Login bansovi.py@gmail.com → entra
- [ ] Login dcgdozt@gmail.com → entra
- [ ] Login cuenta no autorizada → pantalla Acceso no autorizado
- [ ] Cerrar sesion boton EXIT en StatusBar → pantalla login
- [ ] Refrescar pagina logueado → sigue logueado (OAuth2 persistencia)
- [ ] Token expirado → refresh automatico sin pantalla blanca
- [ ] Boot sequence: pantalla carga con terminal se muestra
- [ ] Boton REINTENTAR en pantalla error funciona
- [ ] Boton ACCEDER AL VAULT tras boot → popup Google

### 📲 PWA
- [ ] Instalar como PWA Android (menu ⋮ → Install app / banner)
- [ ] Abrir sin conexion → carga desde SW cache
- [ ] YouTube NO interceptado por SW (bypasa youtube.com/ytimg.com/googlevideo.com)
- [ ] Hard refresh Ctrl+Shift+R no rompe estado
- [ ] manifest.json servido (iconos 192+512, theme-color #050505)
- [ ] Registro SW sin error en consola

### 🎨 LAYOUT / SHELL
- [ ] StatusBar: reloj tiempo real visible
- [ ] StatusBar: estado DB (◈ SYNCING durante escritura)
- [ ] StatusBar: boton EXIT visible y funcional
- [ ] BottomNav: 3 tabs presentes (VAULT · MUSIC LAB · CAPSULES)
- [ ] BottomNav: tab activo iluminado, otros atenuados
- [ ] Navegar VAULT↔MUSIC LAB↔CAPSULES: audio no se corta
- [ ] Volver a MusicLab desde otro tab: UI muestra track correcto y progreso
- [ ] Scanlines overlay visible (efecto CRT)
- [ ] Grid background visible
- [ ] Glow ambiental cambia con vibe activo
- [ ] activeVibe cambia --vibe-accent en :root
- [ ] Skeleton loading states al cargar (no pantalla blanca)
- [ ] Toast feedback aparece y desaparece solo
- [ ] user-select: none — no seleccion texto accidental
- [ ] overscroll-behavior: none — no pull-to-refresh
- [ ] Safe areas respetadas en notch Android

### 🏛️ VAULT — VISTA PRINCIPAL
- [ ] Carrusel Eras horizontal drag-to-scroll
- [ ] EraCard: cover image visible si existe
- [ ] EraCard: color accent, nombre, descripcion
- [ ] EraCard → tap abre EraDetailPanel
- [ ] EraDetailPanel: stats (entradas, fotos, notas, hitos)
- [ ] EraDetailPanel: preview entradas
- [ ] Contador aventura: dias desde fecha inicio visible y animado
- [ ] Heartbeat: corazon verde latiendo si vault seguro
- [ ] Heartbeat: corazon rojo si vault en riesgo (>18m sin heartbeat)
- [ ] HeartbeatWidget: boton heartbeat manual (admin)
- [ ] Capsulas tiempo: bloqueadas con ⧖ y countdown
- [ ] Capsulas tiempo: desbloqueadas con ◈, contenido visible
- [ ] Bibliotecas: lista con estados (ACTIVE / AT RISK / LOST)
- [ ] Bibliotecas: indicador capacidad usado
- [ ] Filtro por usuario (myEntries / myMessages)
- [ ] Boton exportar backup JSON solo admin
- [ ] Demo data cuando no hay DB real

### 🏛️ VAULT — GALERIA WALL
- [ ] Modo WALL: masonry grid entries con imagenes/media
- [ ] WALL: density toggle (normal / compact)
- [ ] WALL: long-press entry → preview
- [ ] WALL: preview se cierra al soltar
- [ ] WALL: tap entry → zoom/full view
- [ ] WALL: zoom se cierra tap fuera
- [ ] WALL: categorias visibles y filtrables
- [ ] WALL: entries sin imagen no rompen layout
- [ ] WALL: scroll sin lag

### 🏛️ VAULT — GALERIA CINEMA
- [ ] Modo CINEMA: full-bleed image
- [ ] CINEMA: swipe left → siguiente entry
- [ ] CINEMA: swipe right → anterior entry
- [ ] CINEMA: Ken Burns effect (zoom lento en pausa)
- [ ] CINEMA: era overlay nombre+fecha
- [ ] CINEMA: auto-pausa 3s inactividad
- [ ] CINEMA: cambiar entry resetea pausa
- [ ] CINEMA: entries sin imagen → texto legible

### 🏛️ VAULT — GALERIA MAP
- [ ] Modo MAP: entries geocodificadas como marcadores
- [ ] MAP: marcadores con color de era
- [ ] MAP: pan+zoom gestos tactiles
- [ ] MAP: date range slider filtra entries
- [ ] MAP: slider dual min/max funcional
- [ ] MAP: era breakdown visible
- [ ] MAP: entries sin coordenadas → no aparecen (no error)

### 🏛️ VAULT — EXHIBITION / REEL / DIALOGUE
- [ ] EXHIBITION: entries curadas en grid visual
- [ ] REEL: feed vertical swipe
- [ ] REEL: swipe down→siguiente, up→anterior
- [ ] DIALOGUE: entries en chat burbujas alternas
- [ ] DIALOGUE: burbujas own/partner diferenciadas
- [ ] DIALOGUE: auto-scroll al ultimo mensaje

### 🏛️ VAULT — ENTRIES CRUD
- [ ] Boton crear entry (+)
- [ ] Formulario crear: titulo, contenido, tipo
- [ ] Formulario: selector tipo (nota, foto, carta, hito...)
- [ ] Formulario: campo ubicacion (LocationSearch)
- [ ] LocationSearch: >=2 chars → resultados
- [ ] LocationSearch: seleccionar → coordenadas guardadas
- [ ] LocationSearch: boton limpiar
- [ ] LocationSearch: manual lat/lng opcional
- [ ] Formulario: selector de era
- [ ] Editar entry → formulario precargado
- [ ] Eliminar entry → confirmacion

### 🎵 MUSIC LAB — LISTA TRACKS
- [ ] Lista tracks carga correctamente
- [ ] 3 modos vista: lista / grid / tarjeta
- [ ] Modo vista persiste en localStorage
- [ ] TrackCard: thumbnail o iniciales artista fallback
- [ ] TrackCardGrid: thumbnail YouTube
- [ ] Vibe filter tags: pastillas scrollables
- [ ] ALL muestra todos
- [ ] Seleccionar tag filtra lista
- [ ] Busqueda texto AND sobre tag activo
- [ ] Carga progresiva: boton CARGAR MAS tras 50
- [ ] Menu contextual ⋮: Play Next
- [ ] Menu ⋮: Anadir a cola
- [ ] Menu ⋮: Anadir a playlist
- [ ] Tap track → reproduce inmediato
- [ ] Tap track activo → toggle play/pause
- [ ] Track activo marcado (borde pulsante)
- [ ] Cambiar filtro con track activo → sigue sonando

### 🎵 MUSIC LAB — AÑADIR/EDITAR TRACK
- [ ] Formulario: titulo, artista, nota, vibe tag
- [ ] Campo URL YouTube valida
- [ ] Campo URL Google Drive MP3
- [ ] Validacion URL YouTube invalida → no crashea
- [ ] Validacion URL YouTube playlist → no crashea
- [ ] Vibe tag obligatorio en formulario
- [ ] Editar: formulario precargado, uuid preservado
- [ ] Banner purpura MODO EDICION ACTIVO visible
- [ ] Modo edicion persiste al guardar (solo sale con ✎)
- [ ] Eliminar track → modal confirmacion destructiva

### ▶ REPRODUCTOR — CONTROLES BASICOS
- [ ] Play/Pause responde <300ms
- [ ] Skip siguiente → track arranca solo (sin 2º tap)
- [ ] Skip anterior: <3s reinicia, >=3s track anterior
- [ ] Seek: arrastrar → soltar → reproduce desde punto exacto
- [ ] Seek YouTube reposiciona iframe
- [ ] Seek Drive reposiciona audio
- [ ] Barra progreso actualiza en tiempo real (cada 1s)
- [ ] Tiempo y duracion visibles y correctos
- [ ] Titulo marquee si overflow
- [ ] Indicador sync status (cola guardandose)

### ▶ REPRODUCTOR — LOOP
- [ ] OFF: termina lista → para
- [ ] Loop lista (🔁): termina → vuelve al primero
- [ ] Loop track (🔂): termina → mismo track se repite
- [ ] Ciclo OFF→lista→track→OFF
- [ ] Boton loop cambia visual por estado
- [ ] Loop lista con 1 track = loop track

### ▶ REPRODUCTOR — SHUFFLE
- [ ] ON → skip a track aleatorio
- [ ] ON no repite hasta pasar todos
- [ ] OFF → orden original
- [ ] Shuffle + cola → respeta cola primero
- [ ] Activar shuffle con track sonando → no interrumpe

// ─── STATE ──────────────────────────────────────────────────
// ─── STATE ──────────────────────────────────────────────────
let S={sections:[],notes:{},checks:{}};
let CT='edu',CF='all',ST='',STimer=null;
// ─── PARSE ──────────────────────────────────────────────────
function pm(md){
  const ls=md.split('\n'),sec=[];let cur=null,idx=0;
  ls.forEach(l=>{
    const ms=l.match(/^###\s+(.+)/),mi=l.match(/^-\s+\[[ x]\]\s+(.+)/);
    if(ms){cur={id:'s'+(sec.length),name:ms[1].trim(),items:[]};sec.push(cur)}
    else if(mi&&cur)cur.items.push({id:'i'+(idx++),text:mi[1].trim()});
  });
  return sec;
}
// ─── PERSIST ──────────────────────────────────────────────────
function ld(){
  try{
    const k='bc_'+CT,d=localStorage.getItem(k);
    if(d){const p=JSON.parse(d);S.notes=p.notes||{};S.checks=p.checks||{};S.sections=p.md?pm(p.md):pm(C)}
    else S.sections=pm(C);
  }catch(e){S.sections=pm(C)}
  if(!S.sections.length)S.sections=pm(C);
}
function sv(){
  const k='bc_'+CT;
  localStorage.setItem(k,JSON.stringify({md:gm(),notes:S.notes,checks:S.checks}));
}
function gm(){return S.sections.map(s=>'### '+s.name+'\n'+s.items.map(i=>'- [ ] '+i.text).join('\n')).join('\n\n');}
// ─── TESTER ──────────────────────────────────────────────────
function setT(t){
  if(t===CT)return;CT=t;
  document.querySelectorAll('.tb').forEach(b=>b.removeAttribute('data-a'));
  document.querySelector(`.tb[onclick*="'${t}'"]`).setAttribute('data-a','true');
  const r=document.documentElement;
  const ac=t==='edu'?'var(--acid)':'var(--purple)';
  const bg=t==='edu'?'rgba(191,255,0,0.12)':'rgba(217,102,255,0.12)';
  r.style.setProperty('--tester-accent',ac);r.style.setProperty('--tester-badge-bg',bg);
  ld();sv();ra();
}
// ─── RENDER ──────────────────────────────────────────────────
function ra(){rs();rmn();rc();us();}
function rs(){
  const sb=document.getElementById('sb');
  sb.innerHTML='<div class="st">secciones</div>'+S.sections.map(s=>{
    const t=s.items.length,d=s.items.filter(i=>S.checks[i.id]).length,p=t?Math.round(d/t*100):0;
    return '<div class="sl'+(p===100?' a':'')+'" onclick="sc(\''+s.id+'\')" id="n'+s.id+'"><div class="sn">'+esc(s.name)+'</div><div class="sp">'+d+'/'+t+'</div></div>';
  }).join('');
}
function rmn(){
  const mn=document.getElementById('mn');
  mn.innerHTML=S.sections.map(s=>{
    const t=s.items.length,d=s.items.filter(i=>S.checks[i.id]).length,p=t?Math.round(d/t*100):0;
    return '<button class="mb" onclick="sc(\''+s.id+'\')">'+esc(s.name)+'</button>';
  }).join('');
}
function rc(){
  const cr=document.getElementById('cr'),st=ST;
  cr.innerHTML=S.sections.map(sec=>{
    const vi=sec.items.filter(i=>{
      if(st&&!i.text.toLowerCase().includes(st))return 0;
      if(CF==='pending'&&S.checks[i.id])return 0;
      if(CF==='done'&&!S.checks[i.id])return 0;
      if(CF==='notes'&&!S.notes[i.id])return 0;
      return 1;
    });
    if(!vi.length)return'';
    const t=sec.items.length,d=sec.items.filter(i=>S.checks[i.id]).length,p=t?Math.round(d/t*100):0;
    return '<div class="sec" id="'+sec.id+'"><div class="sh"><div class="sn">'+esc(sec.name)+'</div><div class="sp"><span>'+d+'/'+t+'</span><div class="prr" style="--p:'+p+'%"><span>'+p+'%</span></div></div></div>'+
      vi.map(i=>{
        const ck=!!S.checks[i.id],nt=S.notes[i.id]||'',hn=!!nt;
        return '<div class="it'+(ck?' c':'')+(hn?' hn':'')+'" id="w'+i.id+'"><div class="im" onclick="tc(\''+i.id+'\')"><div class="ic"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#050505" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="il">'+esc(i.text)+'</div><button class="inb" onclick="event.stopPropagation();tn(\''+i.id+'\')">'+(hn?'✎ nota':'+ nota')+'</button></div><div class="ina'+(hn?' o':'')+'" id="na'+i.id+'"><textarea class="ni" onchange="sn(\''+i.id+'\',this.value)">'+esc(nt)+'</textarea></div></div>';
      }).join('')+(p===100?'<div class="sds">✓ completa</div>':'')+'</div>';
  }).join('');
  if(!cr.innerHTML)cr.innerHTML='<div class="es"><div class="b">⌕</div>No hay resultados</div>';
  uan();
}
function uan(){
  const mc=document.getElementById('mc'),st=mc.scrollTop+100;let a=null;
  S.sections.forEach(s=>{const e=document.getElementById(s.id);if(e&&e.offsetTop<=st)a=s.id});
  document.querySelectorAll('.sl').forEach(l=>l.classList.remove('a'));
  if(a){const ne=document.getElementById('n'+a);if(ne)ne.classList.add('a')}
  document.querySelectorAll('.mb').forEach(b=>b.classList.remove('a'));
  if(a){const sec=S.sections.find(s=>s.id===a);if(sec){document.querySelectorAll('.mb').forEach(b=>{if(b.textContent.trim()===sec.name)b.classList.add('a')})}}
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function sc(id){const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}
// ─── ACTIONS ──────────────────────────────────────────────────
function tc(id){S.checks[id]=!S.checks[id];sv();ra();}
function tn(id){const na=document.getElementById('na'+id);if(!na)return;na.classList.toggle('o');if(na.classList.contains('o')){const ta=na.querySelector('textarea');if(ta)ta.focus()}}
function sn(id,v){
  if(v.trim())S.notes[id]=v;else delete S.notes[id];
  sv();
  const w=document.getElementById('w'+id);
  if(w){if(v.trim())w.classList.add('hn');else w.classList.remove('hn');const b=w.querySelector('.inb');if(b)b.textContent=v.trim()?'✎ nota':'+ nota'}
  us();rs();rmn();
}
function us(){
  let t=0,d=0,n=0;S.sections.forEach(s=>{s.items.forEach(i=>{t++;if(S.checks[i.id])d++;if(S.notes[i.id])n++})});
  document.getElementById('st').textContent=t;document.getElementById('sd').textContent=d;document.getElementById('sn').textContent=n;
  const p=t?Math.round(d/t*100):0;document.getElementById('spb').textContent=p+'%';document.getElementById('pf').style.width=p+'%';
}
// ─── FILTER / SEARCH ──────────────────────────────────────────
function setF(f,btn){CF=f;document.querySelectorAll('.fb').forEach(b=>b.classList.remove('a'));btn.classList.add('a');rc();}
function ds(){clearTimeout(STimer);STimer=setTimeout(()=>{ST=document.getElementById('si').value.toLowerCase();rc()},200);}
// ─── MODALS ──────────────────────────────────────────────────
function oi(){document.getElementById('io').classList.add('o')}
function ci(){document.getElementById('io').classList.remove('o')}
function ai(){
  const md=document.getElementById('ii').value.trim();
  if(!md)return;
  const p=pm(md);
  if(!p.length){alert('No se detectaron secciones (###) ni items (- [ ]).');return}
  S.sections=p;S.notes={};S.checks={};
  sv(md);ra();ci();document.getElementById('ii').value='';
}
function oe(){
  const n=new Date().toISOString().slice(0,16).replace('T',' '),ln=[];
  ln.push('# el_bunker — testing export','# Tester: '+(CT==='edu'?'Edu':'David'),'# Fecha: '+n,'');
  S.sections.forEach(sec=>{
    const t=sec.items.length,d=sec.items.filter(i=>S.checks[i.id]).length;
    ln.push('### '+sec.name+' ('+d+'/'+t+')');
    sec.items.forEach(i=>{ln.push('- ['+(S.checks[i.id]?'x':' ')+'] '+i.text);if(S.notes[i.id])ln.push('  > '+S.notes[i.id].replace(/\n/g,'\n  > '))});
    ln.push('');
  });
  document.getElementById('eo2').value=ln.join('\n');
  document.getElementById('eo').classList.add('o');
}
function ce(){document.getElementById('eo').classList.remove('o')}
function copyEx(){const ta=document.getElementById('eo2');ta.select();navigator.clipboard.writeText(ta.value);const btns=document.querySelectorAll('#eo2+.ma .bn');btns[1].textContent='✓ copiado';setTimeout(()=>btns[1].textContent='⎘ copiar',1500);}
function dlEx(){
  const c=document.getElementById('eo2').value,b=new Blob([c],{type:'text/markdown'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='bunker_'+(CT==='edu'?'edu':'david')+'_'+new Date().toISOString().slice(0,10)+'.md';a.click();
}
function resetAll(){if(confirm('Borrar todo el progreso de '+(CT==='edu'?'Edu':'David')+'?')){S.notes={};S.checks={};sv();ra()}}
// ─── SCROLL ──────────────────────────────────────────────────
document.getElementById('mc').addEventListener('scroll',uan);
document.querySelectorAll('.ov').forEach(o=>{o.addEventListener('click',function(e){if(e.target===this)this.classList.remove('o')})});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.ov.o').forEach(o=>o.classList.remove('o'))}});
// ─── INIT ──────────────────────────────────────────────────
ld();sv();ra();
</script>
