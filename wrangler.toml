# ============================================================
#  EL BÚNKER — wrangler.toml
#  Cloudflare Workers + D1 + R2
#  S54 · Fase 1 — Infraestructura Cloudflare
# ============================================================
name = "el-bunker-api"
main = "workers/worker.js"
compatibility_date = "2025-06-09"

# ═══ D1 Database ═════════════════════════════════════════════
# Crea la DB con: wrangler d1 create el-bunker-db
# Luego copia el database_id aquí y ejecuta: wrangler d1 execute el-bunker-db --file=workers/schema.sql
[[d1_databases]]
binding = "DB"
database_name = "el-bunker-db"
database_id = "795e5e88-6fab-4aa2-a294-d24640a0de05"   # ← remplazar tras `wrangler d1 create el-bunker-db`
migrations_dir = "migrations"

# ═══ R2 Bucket ═══════════════════════════════════════════════
# Crea el bucket con: wrangler r2 bucket create el-bunker
[[r2_buckets]]
binding = "BUNKER"
bucket_name = "el-bunker-music"

# ═══ Environment: production ═════════════════════════════════
[env.production]
vars = { ENVIRONMENT = "production" }

# ═══ Observability ═══════════════════════════════════════════
[observability]
enabled = true
head_sampling_rate = 1
