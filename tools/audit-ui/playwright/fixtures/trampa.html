<!DOCTYPE html>
<html>
<head>
    <title>Pagina trampa para prueba de auditoría</title>
    <style>
        .titulo-cortado {
            width: 100px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            background-color: #ffcccc;
            padding: 10px;
            margin: 20px 0;
        }
        .boton-pequeno {
            width: 20px;
            height: 20px;
            background-color: #00ff00;
            border: 1px solid #000;
            cursor: pointer;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1 class="titulo-cortado">Este título es intencionalmente cortado para simular texto truncado</h1>
    
    <div class="boton-pequeno"></div>
    
    <p>Este párrafo no debe ser truncado.</p>
    
    <script>
        console.error("Este es un error de consola para prueba");
    </script>
</body>
</html>
